name: Release

on:
  push:

jobs:
  test:
    name: Test on ${{ matrix.os }} - ${{ matrix.compiler.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler:
              name: gcc
              cc: gcc
              cxx: g++

          - os: ubuntu-latest
            compiler:
              name: clang
              cc: clang
              cxx: clang++

          - os: macos-latest
            compiler:
              name: clang
              cc: clang
              cxx: clang++

          - os: windows-latest
            compiler:
              name: msvc

          - os: windows-latest
            compiler:
              name: clang
              cc: clang
              cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      # Explicitly prepare the Visual Studio environment on Windows.
      # This makes the VS installation discoverable by CMake.
      - name: Set up Visual Studio environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up compiler (Ubuntu - GCC)
        if: runner.os == 'Linux' && matrix.compiler.name == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up compiler (Ubuntu - Clang)
        if: runner.os == 'Linux' && matrix.compiler.name == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows - MSVC)
        if: runner.os == 'Windows' && matrix.compiler.name == 'msvc'
        run: |
          cmake -B build -G "Visual Studio 17 2022"

      - name: Configure CMake (Windows - Clang)
        if: runner.os == 'Windows' && matrix.compiler.name == 'clang'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -T ClangCL

      - name: Build
        run: cmake --build build --config Release

      - name: Test - base (UNROLLED + CEXPR_ALLOW_CLASS_REPR)
        run: ctest --build-config Release --test-dir build --verbose -R test_base

      - name: Test - portable (UNROLLED + CEXPR_ALLOW_CLASS_REPR + CEXPR_FORCE_PORTABLE_MUL)
        run: ctest --build-config Release --test-dir build --verbose -R test_portable

      - name: Test - protected (UNROLLED + CEXPR_ALLOW_CLASS_REPR + PROTECTED) - Clang only
        if: matrix.compiler.name == 'clang'
        run: ctest --build-config Release --test-dir build --verbose -R test_protected

  create-release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            Release of rapidhash-constexpr
            All CI tests passed successfully on:
            - Ubuntu (GCC, Clang)
            - macOS (Clang)
            - Windows (MSVC, Clang)
          draft: false
          prerelease: false